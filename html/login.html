<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/login.css" />
        <link rel="stylesheet" href="../css/all.css" />
     <link rel="icon" href="../image/222222.png" type="image/png" />
    <title>coolPlay</title>

    <link rel="icon" href="../image/space-background.png" type="image/png" />
  </head>
  <body>
    <div id="container">
      <div class="logo-container">
        <img src="../image/222222.png" alt="Logo" class="logo" />
      </div>
      <form id="login">
        <div class="details">
          <div class="inputs">
            <input type="email" placeholder="email" id="loginEmail"  required>
          </div>
          <div class="inputs">
            <input type="password" placeholder="password" id="loginPass" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>
          </div>
          <span id="alertLogin"></span>
          <div class="inputs">
            <input type="submit" value="login">
          </div>
          <div class="link">
            <a href="#" id="signLink">Sign Up</a>
          </div>
        </div>
      </form>

    <form id="signUp">
     <div class="details">
      <div class="inputs">
        <input type="text" placeholder="name" id="name"  pattern="[A-Za-zא-ת\s]+" required>
      </div>
      <div class="inputs">
        <input type="email" id="signEmail"  placeholder="email"  required>                       
      </div>                    
      <div class="inputs">
        <input type="password" placeholder="A strong password"  id="signPass" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>                        
      </div>                    
      <div class="inputs">
        <input type="password" placeholder="Confirm password" id="confirmPass" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required>  
      </div>
      <span id="alertSign"></span>
       <div class="inputs">
          <input type="submit" value="Sign Up">
      </div>
      <div class="link">
        <div>Already have an acount? </div>
        <a href="#" id="loginLink">Login</a>
      </div>
     </div>
    </form>
  </div>

    <br />
    <br />
    <br />
  </body>
<script src="../js/login.js"></script>
</html>
