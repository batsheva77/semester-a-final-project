<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/all.css" />
    <link rel="stylesheet" href="../css/game.css" />
    <link rel="icon" href="../image/222222.png" type="image/png" />

    <title>game</title>
  </head>
  <body>
    <div id="all"></div>
    <div id="levelBack">
      <a href="../html/Instructions.html">Back to level menu</a>
    </div>
    <div id="userNameAndProfilePic">
      <div id="profilePic">
        <img src="../image/astronaut.jpg" alt="Profile Picture" />
      </div>
      <div id="userName">User Name</div>
    </div>
    <div id="boardAndScore">
      <div id="gameAndtopRow">
        <div id="gameBoard"></div>
      </div>

      <div id="score">
        <p>The least of time Beginners level:</p>
        <div id="level0">59:59</div>
        <p>The least of time Intermediate level:</p>
        <div id="level1">59:59</div>
        <p>The least of time Experts level:</p>
        <div id="level2">59:59</div>
      </div>
    </div>

    <div id="loosingAlert">
      <div id="loserText">you lost the game! maybe next time...</div>
      <a href="javascript:location.reload()">new game</a>
      <a href="../html/login.html">log out</a>
    </div>
    <div id="winningAlert">
      <div id="youWon"></div>
      <a href="javascript:location.reload()">new game</a>
      <a href="../html/login.html">log out</a>
    </div>
  </body>
  <script src="../js/all.js"></script>
  <script src="../js/game.js"></script>
</html>
